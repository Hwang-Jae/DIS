<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생산 관리 백엔드 제어판</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">⚙️ 백엔드 서버 제어</h2>
        <p class="text-sm text-gray-600 mb-6">분석 서비스(FastAPI)를 시작하거나 중지합니다.</p>
        
        <div class="space-y-4">
            <button onclick="controlServer('start')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                🚀 서비스 시작 (Start)
            </button>
            <button onclick="controlServer('stop')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition">
                ⏹️ 서비스 중지 (Stop)
            </button>
        </div>

        <div id="status" class="mt-6 p-4 rounded-lg bg-gray-50 border border-gray-200">
            <p class="text-sm font-medium">상태: <span id="statusText" class="text-gray-500">대기 중</span></p>
        </div>
    </div>

    <script>
        async function controlServer(action) {
            const statusText = document.getElementById('statusText');
            
            if (action === 'start') {
                statusText.innerText = "터미널에서 'python -m uvicorn main:app --reload'를 실행하세요.";
                alert("브라우저에서는 서버를 켤 수 없습니다. 터미널 창을 확인해 주세요.");
            } else if (action === 'stop') {
                statusText.innerText = '중지 중...';
                try {
                    await fetch('http://localhost:8000/admin/stop', { method: 'POST' });
                    statusText.innerText = '서버가 중지되었습니다.';
                } catch (e) {
                    statusText.innerText = '서버 연결 실패 (이미 중지되었을 수 있습니다).';
                }
            }
        }
    </script>
</body>
</html>
